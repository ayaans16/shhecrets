services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"

  backend:
    build:
      context: ../backend
    env_file:
      - ../backend/.env.example
    environment:
      # Overrides .env.example values: inside compose's network the
      # backend reaches these by service name, not localhost.
      REDIS_URL: redis://redis:6379/0
      MONGO_URL: mongodb://mongo:27017
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - mongo

# The frontend joins this file in a later stage - not wired up yet since
# Stage 2 is Redis + Mongo + backend only.
