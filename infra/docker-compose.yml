services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"

  backend:
    build:
      context: ../backend
    env_file:
      - ../backend/.env.example
    environment:
      # Overrides .env.example values: inside compose's network the
      # backend reaches these by service name, not localhost.
      REDIS_URL: redis://redis:6379/0
      MONGO_URL: mongodb://mongo:27017
      # The Vite dev server (5173) and the containerized frontend (8080,
      # below) are both valid origins depending on how you're running
      # things locally - both allowed here for dev convenience.
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - mongo

  frontend:
    build:
      context: ../frontend
      args:
        # The browser calls this directly (it's not container-to-
        # container traffic), so it has to be an address the *host*
        # machine can reach - localhost:8000, the backend's published
        # port - not the "backend" service DNS name, which only
        # resolves inside the compose network.
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      - backend
