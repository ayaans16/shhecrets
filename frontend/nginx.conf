server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: routes like /s/<id> aren't real files - the app's own
    # client-side routing (App.tsx) handles them once index.html loads.
    # Vite's dev server does this automatically; nginx needs to be told.
    location / {
        try_files $uri /index.html;
    }
}
